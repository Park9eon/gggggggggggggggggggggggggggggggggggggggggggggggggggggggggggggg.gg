<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="g.gg" />
    <meta name="theme-color" content="#080808" />
    <title>g.gg</title>
    <style>
      :root { color-scheme: dark; background: #080808; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; min-width: 320px; margin: 0; background: #080808; }
      body { overflow: hidden; }
      main { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sr-only">g.gg</h1>
      <canvas id="scene" aria-hidden="true"></canvas>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector("#scene");
        const context = canvas.getContext("2d");
        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        const INK = "#e8e8e8";
        const LOOP_SECONDS = 10;
        const FRAME_INTERVAL = 1000 / 20;
        const state = {
          width: 0, height: 0, fontSize: 0, cellWidth: 0, cellHeight: 0, columns: 0, rows: 0,
          base: null, field: null, mask: null, sprites: null, frame: 0, lastPaint: 0, startedAt: performance.now(),
        };

        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
        const ease = (start, end, value) => {
          const progress = clamp((value - start) / (end - start));
          return progress * progress * (3 - 2 * progress);
        };

        function hash(x, y) {
          const value = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
          return value - Math.floor(value);
        }

        function makeCanvas(width, height) {
          const layer = document.createElement("canvas");
          layer.width = Math.ceil(width);
          layer.height = Math.ceil(height);
          return layer;
        }

        function makeSprite(character, weight, scale) {
          const size = Math.ceil(Math.max(state.cellWidth, state.cellHeight) * 2.4);
          const sprite = makeCanvas(size, size);
          const spriteContext = sprite.getContext("2d");
          spriteContext.textAlign = "center";
          spriteContext.textBaseline = "middle";
          spriteContext.font = `${weight} ${state.fontSize * scale}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          spriteContext.fillStyle = INK;
          spriteContext.fillText(character, size / 2, size / 2);
          return sprite;
        }

        function buildSprites() {
          state.sprites = {
            dot: makeSprite(".", 400, 0.8),
            fine: makeSprite(",", 400, 0.64),
            grain: makeSprite("g", 400, 0.76),
            soft: makeSprite("g", 600, 0.96),
            dense: makeSprite("9", 700, 1.02),
            round: makeSprite("q", 800, 1.08),
            bold: makeSprite("G", 900, 1.15),
          };
        }

        function drawSprite(targetContext, sprite, x, y) {
          const size = sprite.width;
          targetContext.drawImage(sprite, x - size / 2, y - size / 2);
        }

        function buildBase() {
          const layer = makeCanvas(state.width, state.height);
          const layerContext = layer.getContext("2d");
          const palette = [
            state.sprites.dot, state.sprites.dot, state.sprites.dot, state.sprites.fine,
            state.sprites.dot, state.sprites.grain, state.sprites.dot, state.sprites.grain,
          ];
          for (let row = 0; row < state.rows; row += 1) {
            for (let column = 0; column < state.columns; column += 1) {
              drawSprite(
                layerContext,
                palette[Math.floor(hash(column, row) * palette.length)],
                (column + 0.5) * state.cellWidth,
                (row + 0.5) * state.cellHeight,
              );
            }
          }
          return layer;
        }

        function rebuild() {
          const bounds = canvas.getBoundingClientRect();
          const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
          state.width = Math.round(bounds.width);
          state.height = Math.round(bounds.height);
          state.fontSize = clamp(Math.min(state.width, state.height) / 45, 18, 24);
          state.cellWidth = state.fontSize * 0.64;
          state.cellHeight = state.fontSize * 1.05;
          state.columns = Math.ceil(state.width / state.cellWidth);
          state.rows = Math.ceil(state.height / state.cellHeight);
          canvas.width = Math.round(state.width * ratio);
          canvas.height = Math.round(state.height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
          buildSprites();
          state.base = buildBase();
          state.field = makeCanvas(state.width, state.height);
          state.mask = makeCanvas(state.columns, state.rows);
          render(performance.now(), true);
        }

        function paintMask(seconds) {
          const loop = seconds % LOOP_SECONDS;
          const appear = ease(0.65, 2.3, loop);
          const split = ease(4.1, 6.5, loop);
          const dissolve = 1 - ease(8.25, LOOP_SECONDS, loop);
          const basis = Math.min(state.columns, state.rows);
          const maskContext = state.mask.getContext("2d", { willReadFrequently: true });
          maskContext.clearRect(0, 0, state.columns, state.rows);
          const origin = { x: state.columns / 2, y: state.rows / 2 + basis * 0.05 };
          const destinations = [
            { x: 0, y: -state.rows * 0.3 },
            { x: -state.columns * 0.18, y: state.rows * 0.27 },
            { x: state.columns * 0.18, y: state.rows * 0.27 },
          ];
          const size = basis * 0.72 * (0.22 + appear * 0.78) * (1 - split * 0.46);
          maskContext.fillStyle = "#fff";
          maskContext.font = `900 ${size}px Arial Black, Arial, sans-serif`;
          maskContext.textAlign = "center";
          maskContext.textBaseline = "middle";
          destinations.forEach((destination) => {
            maskContext.fillText(
              "G",
              origin.x + destination.x * split,
              origin.y + destination.y * split,
            );
          });

          return {
            appear,
            split,
            dissolve,
            data: maskContext.getImageData(0, 0, state.columns, state.rows).data,
          };
        }

        function render(now, still = false) {
          const seconds = still ? 5 : (now - state.startedAt) / 1000;
          const { appear, split, dissolve, data } = paintMask(seconds);
          const fieldContext = state.field.getContext("2d");
          const backgroundTick = Math.floor(seconds * 4);
          fieldContext.clearRect(0, 0, state.width, state.height);
          fieldContext.drawImage(state.base, 0, 0);

          for (let row = 0; row < state.rows; row += 1) {
            for (let column = 0; column < state.columns; column += 1) {
              const mask = data[(row * state.columns + column) * 4 + 3] / 255;
              const x = (column + 0.5) * state.cellWidth;
              const y = (row + 0.5) * state.cellHeight;
              if (mask < 0.08 || hash(column + 13, row + 7) > appear * dissolve) {
                const backgroundNoise = hash(column + backgroundTick * 17, row - backgroundTick * 11);
                const backgroundWave = (Math.sin(column * 0.17 + row * 0.09 - seconds * 1.6) + 1) / 2;
                if (backgroundNoise > 0.972 && backgroundWave > 0.46) {
                  const backgroundSprite = backgroundNoise > 0.992
                    ? state.sprites.dense
                    : backgroundNoise > 0.983
                      ? state.sprites.soft
                      : state.sprites.grain;
                  drawSprite(fieldContext, backgroundSprite, x, y);
                }
                continue;
              }
              const wave = (Math.sin(column * 0.42 + row * 0.25 - seconds * 4.2) + 1) / 2;
              const strength = clamp(mask * (0.76 + wave * 0.24));
              const sprite = strength > 0.82 && (wave > 0.66 || split > 0.58)
                ? state.sprites.bold
                : strength > 0.6
                  ? state.sprites.round
                  : state.sprites.dense;
              drawSprite(fieldContext, sprite, x, y);
            }
          }

          context.clearRect(0, 0, state.width, state.height);
          context.drawImage(state.field, 0, 0);
        }

        function tick(now) {
          if (now - state.lastPaint >= FRAME_INTERVAL) {
            state.lastPaint = now;
            render(now);
          }
          if (!motionQuery.matches) state.frame = requestAnimationFrame(tick);
        }

        function restart() {
          cancelAnimationFrame(state.frame);
          state.startedAt = performance.now();
          state.lastPaint = 0;
          render(performance.now(), motionQuery.matches);
          if (!motionQuery.matches) state.frame = requestAnimationFrame(tick);
        }

        window.addEventListener("resize", rebuild, { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelAnimationFrame(state.frame);
          else restart();
        });
        motionQuery.addEventListener("change", restart);
        rebuild();
        if (!motionQuery.matches) state.frame = requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
